<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamber Files Portal - Verification</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- PDF.js rendering library for proper fitting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #1a1a1a;
        }
        
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* ব্লিঙ্কিং লোগো কন্টেইনার */
        .loading-container { 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        @keyframes blink { 
            0% { opacity: 0.2; transform: scale(0.98); } 
            50% { opacity: 1; transform: scale(1); } 
            100% { opacity: 0.2; transform: scale(0.98); } 
        }
        
        .loading-container img { 
            width: 180px; 
            height: 180px;
            animation: blink 1.5s infinite ease-in-out; 
            margin-bottom: 20px;
        }

        .loading-text {
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        /* এরর মেসেজ দেখানোর স্টাইল */
        .error-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            display: none;
            font-family: 'Segoe UI', sans-serif;
            border-top: 5px solid #c62828;
        }
        .error-title { color: #c62828; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .error-desc { color: #555; font-size: 14px; }

        /* পিডিএফ ক্যানভাস কন্টেইনার - ১০০% ফিট */
        #pdfViewerContainer {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: #525659;
            overflow-y: auto;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-width: 100%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="loadingSection" class="loading-container">
        <img src="logo.png" alt="Chamber Logo">
        <div class="loading-text">جاري تحميل المستند الرسمي... (Official Document Loading...)</div>
    </div>

    <div id="errorSection" class="error-box">
        <div id="errorTitle" class="error-title"></div>
        <div id="errorDesc" class="error-desc"></div>
    </div>

    <!-- পিডিএফ রেন্ডার করার কন্টেইনার -->
    <div id="pdfViewerContainer"></div>

<script>
    const SECRET_KEY = "ChamberOfficialSecretKey#2026";
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function showError(title, desc) {
        document.getElementById('loadingSection').style.display = 'none';
        document.getElementById('pdfViewerContainer').style.display = 'none';
        document.getElementById('errorSection').style.display = 'block';
        document.getElementById('errorTitle').innerText = title;
        document.getElementById('errorDesc').innerText = desc;
    }

    function renderPDF(url) {
        pdfjsLib.getDocument(url).promise.then(pdf => {
            const container = document.getElementById('pdfViewerContainer');
            container.innerHTML = ''; // আগের কোনো কনটেন্ট থাকলে ক্লিয়ার করবে

            // সব পেজ রেন্ডার করবে যাতে স্ক্রিন ফিট হয়
            let renderPage = function(pageNumber) {
                pdf.getPage(pageNumber).then(page => {
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    container.appendChild(canvas);
                    page.render(renderContext);

                    if (pageNumber < pdf.numPages) {
                        renderPage(pageNumber + 1);
                    }
                });
            };

            renderPage(1);

            // লোডিং বন্ধ করে পিডিএফ দেখাবে
            document.getElementById('loadingSection').style.display = 'none';
            container.style.display = 'flex';

        }).catch(error => {
            showError("❌ Document Not Found", "The requested file does not exist or couldn't be loaded.");
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const encryptedId = getQueryParam('id');

        if (!encryptedId) {
            showError("❌ Error 403", "Invalid Access Token or Bad Request.");
            return;
        }

        try {
            const formattedToken = encryptedId.replace(/ /g, '+');
            const bytes = CryptoJS.AES.decrypt(formattedToken, SECRET_KEY);
            const decryptedRealId = bytes.toString(CryptoJS.enc.Utf8);

            if (!decryptedRealId) {
                showError("❌ Verification Failed", "Tampered or Expired Token.");
                return;
            }

            const pdfUrl = `pdfs/${decryptedRealId}.pdf`;

            setTimeout(() => {
                renderPDF(pdfUrl);
            }, 1500);

        } catch (e) {
            showError("❌ Error", "Invalid Security Encryption Format.");
        }
    });
</script>

</body>
</html>
